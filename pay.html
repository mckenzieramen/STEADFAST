<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEADFAST Checkout</title><link rel="stylesheet" href="styles.css"><script src="email-config.js"></script></head><body class="sf-checkout-page"><main class="sf-checkout-wrap"><a class="brand sf-checkout-brand" href="store.html"><span class="brand-mark"><img src="assets/steadfast-mark.png" alt="STEADFAST"></span><span><b>STEADFAST</b><small>BY CLIFF JANDEE MEDRANO</small></span></a><section class="sf-payment-shell" id="paymentShell"><div class="sf-loading">Loading secure checkout details…</div></section></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getFirestore,doc,getDoc,onSnapshot,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
const cfg={apiKey:"AIzaSyD13MXR0ZQSjPJBxQKYPmsMKjl4yzU2hSs",authDomain:"steadfast-1d0e6.firebaseapp.com",projectId:"steadfast-1d0e6",storageBucket:"steadfast-1d0e6.firebasestorage.app",messagingSenderId:"488385339804",appId:"1:488385339804:web:0d2bcf3967a8f95ccfe859"};
const app=getApps().length?getApps()[0]:initializeApp(cfg),db=getFirestore(app),storage=getStorage(app),auth=getAuth(app);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(v,c)=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c}).format(Number(v||0))}catch{return `${c} ${Number(v||0).toFixed(2)}`}};const id=new URLSearchParams(location.search).get("order");let currentOrder=null;
function paymentTarget(o){let u=o.mariBankLink||o.paymentUrl||"";return u.replaceAll("{amount}",encodeURIComponent(Number(o.amount||0).toFixed(2))).replaceAll("{order}",encodeURIComponent(id));}
function statusMarkup(o){if(o.status==="paid")return `<div class="sf-success"><strong>Payment confirmed ✓</strong><span>Your payment was confirmed by STEADFAST.</span>${o.unlockUrl?`<a class="btn primary full" href="${esc(o.unlockUrl)}" target="_blank" rel="noopener">Unlock / Access Product →</a>`:`<span>Your access link will be provided by email.</span>`}</div>`;if(o.status==="failed"||o.status==="cancelled")return `<div class="sf-error"><strong>Payment not approved</strong><span>Your product remains locked. You may return to the Store and start a new payment.</span><a class="btn ghost full" href="store.html">Return to Store</a></div>`;return `<div class="sf-verifying"><strong>${o.status==="verifying"?"Payment proof received — verifying":"Awaiting payment"}</strong><span>${o.status==="verifying"?"Your receipt is now with the STEADFAST admin for confirmation.":"Complete the payment, then upload your receipt below."}</span></div>`}
async function ensureCustomerAuth(){if(auth.currentUser)return auth.currentUser;const cred=await signInAnonymously(auth);return cred.user;}
async function run(){const host=document.getElementById("paymentShell");if(!id){host.innerHTML="<h2>Missing order.</h2>";return}await ensureCustomerAuth();const snap=await getDoc(doc(db,"storeOrders",id));if(!snap.exists()){host.innerHTML="<h2>Order not found.</h2>";return}const original=snap.data();render(original);onSnapshot(doc(db,"storeOrders",id),s=>{if(s.exists())render({...original,...s.data()})});}
function render(o){currentOrder=o;const host=document.getElementById("paymentShell"),target=paymentTarget(o);host.innerHTML=`<div class="sf-payment-card"><span class="sf-work-tag">STEADFAST CHECKOUT</span><h1>${o.status==="paid"?"Purchase confirmed.":"Complete your purchase."}</h1><p>Product: <b>${esc(o.productName)}</b></p><div class="sf-checkout-price"><span>Fixed amount</span><strong>${money(o.amount,o.currency||"PHP")}</strong></div><div class="sf-payment-method"><span>Payment method</span><strong>${esc(o.paymentMethod||"Manual verification")}</strong></div>${o.status!=="paid"&&target?`<div class="sf-qr-wrap"><div id="paymentQr"></div><small>Scan to pay the exact amount shown above.</small><a class="btn primary full" href="${esc(target)}" target="_blank" rel="noopener">Open Payment Link ↗</a></div>`:""}${o.status!=="paid"&&o.status!=="failed"&&o.status!=="cancelled"?`<div class="sf-proof-box"><h3>After you pay</h3><p>Upload the payment receipt. STEADFAST will review it manually before unlocking the product.</p><form id="proofForm"><label>Email<input name="email" type="email" value="${esc(o.customerEmail||"")}" required></label><label>Payment proof<input name="receipt" type="file" accept="image/*,.pdf" required></label><button class="btn primary full" type="submit">Submit Payment Proof →</button><small>Do not upload passwords, OTPs, PINs or other sensitive banking information.</small></form><div id="proofMsg"></div></div>`:""}<div id="statusBox">${statusMarkup(o)}</div><small>Order code: ${esc(id)}</small></div>`;if(target&&o.status!=="paid"&&window.QRCode){const q=document.getElementById("paymentQr");if(q)new QRCode(q,{text:target,width:220,height:220})}const form=document.getElementById("proofForm");if(form)form.addEventListener("submit",submitProof)}
async function submitProof(e){e.preventDefault();await ensureCustomerAuth();const form=e.currentTarget,msg=document.getElementById("proofMsg"),file=form.receipt.files[0];if(!file)return;try{msg.textContent="Uploading payment proof…";const safe=file.name.replace(/[^a-z0-9._-]/gi,"-");const r=ref(storage,`store/receipts/${id}/${Date.now()}-${safe}`);const uploaded=await uploadBytes(r,file,{contentType:file.type||"application/octet-stream"});const url=await getDownloadURL(uploaded.ref);const email=form.email.value.trim().toLowerCase();await updateDoc(doc(db,"storeOrders",id),{receiptUrl:url,receiptFileName:file.name,paymentStatus:"verifying",status:"verifying",updatedAt:serverTimestamp()});await sendEmail({action:"paymentSubmitted",customerEmail:email,customerName:currentOrder.customerName||"Customer",productName:currentOrder.productName||"",amount:currentOrder.amount||"",currency:currentOrder.currency||"PHP",orderId:id});msg.innerHTML="<strong>Payment proof submitted ✓</strong> Your order is now waiting for manual confirmation.";form.reset();}catch(err){console.error(err);msg.textContent="We could not upload the payment proof. Please try again."}}
async function sendEmail(data){const cfg=window.STEADFAST_EMAIL_CONFIG||{};if(!cfg.webAppUrl)return;try{await fetch(cfg.webAppUrl,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams(Object.entries(data))})}catch(e){console.warn(e)}}
run().catch(e=>{console.error(e);const host=document.getElementById("paymentShell");host.innerHTML=`<div class="sf-error"><h2>Checkout unavailable.</h2><p>${esc(e?.code||e?.message||"We could not load this order.")}</p><p>If this is your first customer checkout after this update, Anonymous sign-in must be enabled in Firebase Authentication.</p></div>`});
</script></body></html>
