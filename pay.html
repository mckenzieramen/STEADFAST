<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEADFAST Checkout</title><link rel="stylesheet" href="styles.css"><script src="email-config.js"></script></head><body class="sf-checkout-page"><main class="sf-checkout-wrap"><a class="brand sf-checkout-brand" href="index.html#shop"><span class="brand-mark"><img src="assets/steadfast-mark.png" alt="STEADFAST"></span><span><b>STEADFAST</b><small>BY CLIFF JANDEE MEDRANO</small></span></a><section class="sf-payment-shell" id="paymentShell"><div class="sf-loading">Loading secure checkout details…</div></section></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getFirestore,doc,getDoc,onSnapshot,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
import {collection,addDoc} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyD13MXR0ZQSjPJBxQKYPmsMKjl4yzU2hSs",authDomain:"steadfast-1d0e6.firebaseapp.com",projectId:"steadfast-1d0e6",storageBucket:"steadfast-1d0e6.firebasestorage.app",messagingSenderId:"488385339804",appId:"1:488385339804:web:0d2bcf3967a8f95ccfe859"};
const app=getApps().length?getApps()[0]:initializeApp(cfg),db=getFirestore(app),storage=getStorage(app);const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=(v,c)=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c}).format(Number(v||0))}catch{return `${c} ${Number(v||0).toFixed(2)}`}};const id=new URLSearchParams(location.search).get("order");
function paymentTarget(o){let u=o.mariBankLink||o.paymentUrl||"";return u.replaceAll("{amount}",encodeURIComponent(Number(o.amount||0).toFixed(2))).replaceAll("{order}",encodeURIComponent(id));}
function statusMarkup(o){if(o.status==="paid")return `<div class="sf-success"><strong>Payment verified ✓</strong><span>Your purchase is unlocked below.</span><a class="btn primary full" href="${esc(o.unlockUrl||"")}" target="_blank" rel="noopener">Unlock / Access Product →</a></div>`;if(o.status==="failed")return `<div class="sf-error"><strong>Payment failed / not verified</strong><span>Please check the payment details and submit a new proof of payment.</span></div>`;return `<div class="sf-verifying"><strong>${o.status==="verifying"?"Payment proof received — verifying":"Awaiting payment"}</strong><span>We will verify the payment and email you when your order is confirmed.</span></div>`}
async function run(){const host=document.getElementById("paymentShell");if(!id){host.innerHTML="<h2>Missing order.</h2>";return}const snap=await getDoc(doc(db,"storeUnlocks",id));if(!snap.exists()){host.innerHTML="<h2>Order not found.</h2>";return}const o=snap.data();const target=paymentTarget(o);host.innerHTML=`<div class="sf-payment-card"><span class="sf-work-tag">STEADFAST CHECKOUT</span><h1>Complete your purchase.</h1><p>Product: <b>${esc(o.productName)}</b></p><div class="sf-checkout-price"><span>Fixed amount</span><strong>${money(o.amount,o.currency||"USD")}</strong></div><div class="sf-payment-method"><span>Payment method</span><strong>${esc(o.paymentMethod||"Online payment")}</strong></div>${target?`<div class="sf-qr-wrap"><div id="paymentQr"></div><small>Scan to pay the exact amount above.</small><a class="btn primary full" href="${esc(target)}" target="_blank" rel="noopener">Open Payment Link ↗</a></div>`:`<div class="sf-empty-store"><strong>Payment link not configured.</strong><span>Please contact STEADFAST for payment instructions.</span></div>`}${o.previewImage?`<div class="sf-payment-preview"><img src="${esc(o.previewImage)}" alt="${esc(o.productName)} preview"><small>Product preview</small></div>`:""}<div class="sf-proof-box"><h3>After payment</h3><p>Enter the email used for this order and upload your payment receipt/screenshot.</p><form id="proofForm"><label>Email<input name="email" type="email" value="${esc(o.customerEmail||"")}" required></label><label>Payment proof<input name="receipt" type="file" accept="image/*,.pdf" required></label><button class="btn primary full" type="submit">Submit Payment Proof →</button><small>Do not upload passwords, OTPs, or other sensitive banking credentials.</small></form><div id="proofMsg"></div></div><div id="statusBox">${statusMarkup(o)}</div><small>Order code: ${esc(id)}</small></div>`;
if(target&&window.QRCode)new QRCode(document.getElementById("paymentQr"),{text:target,width:220,height:220});
const form=document.getElementById("proofForm");form.addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("proofMsg"),file=form.receipt.files[0];if(!file)return;try{msg.textContent="Uploading payment proof…";const safe=file.name.replace(/[^a-z0-9._-]/gi,"-");const r=ref(storage,`store/receipts/${id}/${Date.now()}-${safe}`);const uploaded=await uploadBytes(r,file,{contentType:file.type||"application/octet-stream"});const url=await getDownloadURL(uploaded.ref);await updateDoc(doc(db,"storeOrders",id),{receiptUrl:url,receiptFileName:file.name,paymentStatus:"verifying",status:"verifying",updatedAt:serverTimestamp()});await updateDoc(doc(db,"storeUnlocks",id),{receiptUrl:url,status:"verifying",updatedAt:serverTimestamp()});await sendEmail({action:"paymentSubmitted",customerEmail:o.customerEmail||form.email.value,customerName:o.customerName||"Customer",productName:o.productName,amount:o.amount,currency:o.currency,orderId:id});msg.innerHTML="<strong>Payment proof submitted ✓</strong> We sent a confirmation email and your payment is now being verified.";form.reset();}catch(err){console.error(err);msg.textContent="We could not upload the payment proof. Please try again."}});
onSnapshot(doc(db,"storeOrders",id),snap=>{if(!snap.exists())return;const latest={...o,...snap.data()};document.getElementById("statusBox").innerHTML=statusMarkup(latest);if(latest.status==="paid"){document.getElementById("proofForm")?.setAttribute("hidden","");}});
}
async function sendEmail(data){const cfg=window.STEADFAST_EMAIL_CONFIG||{};if(!cfg.webAppUrl)return;try{await fetch(cfg.webAppUrl,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams(Object.entries(data))})}catch(e){console.warn(e)}}
run().catch(e=>{console.error(e);document.getElementById("paymentShell").innerHTML="<h2>Checkout unavailable.</h2>"});
</script></body></html>
