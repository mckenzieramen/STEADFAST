const cfg={apiKey:"AIzaSyD13MXR0ZQSjPJBxQKYPmsMKjl4yzU2hSs",authDomain:"steadfast-1d0e6.firebaseapp.com",projectId:"steadfast-1d0e6",storageBucket:"steadfast-1d0e6.firebasestorage.app",messagingSenderId:"488385339804",appId:"1:488385339804:web:0d2bcf3967a8f95ccfe859"};const app=getApps().length?getApps()[0]:initializeApp(cfg),db=getFirestore(app);const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=(v,c)=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c}).format(Number(v||0))}catch{return `${c} ${Number(v||0).toFixed(2)}`}};const id=new URLSearchParams(location.search).get("order");async function run(){const host=document.getElementById("paymentShell");if(!id){host.innerHTML="<h2>Missing order.</h2>";return}const snap=await getDoc(doc(db,"storeUnlocks",id));if(!snap.exists()){host.innerHTML="<h2>Order not found.</h2>";return}const o=snap.data();host.innerHTML=`<div class="sf-payment-card"><span class="sf-work-tag">STEADFAST CHECKOUT</span><h1>Complete your purchase.</h1><p>Product: <b>${esc(o.productName)}</b></p><div class="sf-checkout-price"><span>Fixed amount</span><strong>${money(o.amount,o.currency||"USD")}</strong></div><div class="sf-payment-method"><span>Payment method</span><strong>${esc(o.paymentMethod||"Online payment")}</strong></div>${o.paymentUrl?`<a class="btn primary full" href="${esc(o.paymentUrl)}" target="_blank" rel="noopener">Proceed to Payment ↗</a>`:`<div class="sf-empty-store"><strong>Payment link not configured.</strong><span>Please contact STEADFAST for payment instructions.</span></div>`}<a class="btn ghost dark-text full" href="unlock.html?order=${encodeURIComponent(id)}">I've completed payment →</a><small>Order code: ${esc(id)}</small></div>`}run().catch(e=>{document.getElementById("paymentShell").innerHTML="<h2>Checkout unavailable.</h2>"});
</script></body></html>
