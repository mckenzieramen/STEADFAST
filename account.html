<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="STEADFAST customer account login and registration."><title>STEADFAST Account</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="styles.css"><style>
.account-page{min-height:100vh;background:#09090d;padding:120px 20px 60px;display:grid;place-items:center}.account-card{width:min(520px,100%);background:#fff;border-radius:26px;padding:34px;box-shadow:0 30px 100px #0007}.account-card h1{font:800 40px/1 Manrope;margin:10px 0}.account-card p{color:#707482;line-height:1.6}.account-tabs{display:flex;gap:8px;margin:24px 0 18px}.account-tabs button{flex:1;border:1px solid #ddd8e7;background:#fff;border-radius:11px;padding:12px;font-weight:800;cursor:pointer}.account-tabs button.active{background:#17131f;color:#fff;border-color:#17131f}.account-form{display:grid;gap:13px}.account-form label{font-size:11px;font-weight:800;color:#403b48}.account-form input{display:block;width:100%;margin-top:6px;padding:13px;border:1px solid #ddd8e7;border-radius:11px}.account-form button{margin-top:5px}.account-status{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f7f3ff;color:#5d38a7;font-size:12px}.account-status.error{background:#fff0f1;color:#a02b36}.account-back{display:inline-block;margin-top:18px;color:#5d38a7;font-weight:800;font-size:12px}
</style></head><body><header class="site-header"><a class="brand" href="index.html#home"><span class="brand-mark"><img src="assets/steadfast-mark.png" alt="STEADFAST"></span><span><b>STEADFAST</b><small>BY CLIFF JANDEE MEDRANO</small></span></a><nav class="nav"><a href="index.html#home">Home</a><a href="store.html">Store</a><a href="reviews.html">Reviews</a></nav></header><main class="account-page"><section class="account-card"><p class="eyebrow purple">STEADFAST CUSTOMER ACCOUNT</p><h1 id="accountTitle">Sign in.</h1><p id="accountIntro">Sign in to purchase products, access your purchases, and leave verified buyer reviews.</p><div class="account-tabs"><button id="loginTab" class="active" type="button">Sign in</button><button id="registerTab" type="button">Create account</button></div><form id="accountForm" class="account-form"><label>Email<input id="accountEmail" type="email" autocomplete="email" required></label><label>Password<input id="accountPassword" type="password" autocomplete="current-password" minlength="6" required></label><label id="confirmWrap" hidden>Confirm password<input id="accountConfirm" type="password" autocomplete="new-password" minlength="6"></label><button class="btn primary full" id="accountSubmit" type="submit">Sign in →</button></form><div id="accountStatus" class="account-status" hidden></div><a class="account-back" href="store.html">← Back to Store</a></section></main><script type="module" src="account.js"></script></body></html>
